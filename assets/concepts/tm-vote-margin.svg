<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>The vote margin T</title><desc>Chance that an example trains a class&#x27;s clauses, against that class&#x27;s vote sum. For the correct class it falls from always at minus T to never at plus T; for a wrong class it rises.</desc><style>@keyframes k1{0.000%{transform:translate(-241.2px,-127.3px)} 80.000%{transform:translate(90.0px,47.5px)} 92.000%{transform:translate(90.0px,47.5px)} 100.000%{transform:translate(-241.2px,-127.3px)}}
.k1{animation:k1 10s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.anim{animation:none!important}}</style><rect x="110" y="46" width="360" height="190" rx="0" fill="#f6f4fb" stroke="none" stroke-width="1.5" />
<line x1="110" y1="236" x2="470" y2="236" stroke="#cfd3db" stroke-width="1" stroke-linecap="round" />
<text x="102" y="240" font-size="11.5" fill="#646b78" text-anchor="end" font-weight="normal" >never</text>
<line x1="110" y1="141" x2="470" y2="141" stroke="#cfd3db" stroke-width="1" stroke-linecap="round" />
<text x="102" y="145" font-size="11.5" fill="#646b78" text-anchor="end" font-weight="normal" >half</text>
<line x1="110" y1="46" x2="470" y2="46" stroke="#cfd3db" stroke-width="1" stroke-linecap="round" />
<text x="102" y="50" font-size="11.5" fill="#646b78" text-anchor="end" font-weight="normal" >always</text>
<line x1="110" y1="236" x2="110" y2="241" stroke="#646b78" stroke-width="1.2" stroke-linecap="round" />
<text x="110" y="256" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" >−T</text>
<text x="110" y="271" font-size="11" fill="#646b78" text-anchor="middle" font-weight="normal" >clearly says no</text>
<line x1="290" y1="236" x2="290" y2="241" stroke="#646b78" stroke-width="1.2" stroke-linecap="round" />
<text x="290" y="256" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" >0</text>
<text x="290" y="271" font-size="11" fill="#646b78" text-anchor="middle" font-weight="normal" >undecided</text>
<line x1="470" y1="236" x2="470" y2="241" stroke="#646b78" stroke-width="1.2" stroke-linecap="round" />
<text x="470" y="256" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" >+T</text>
<text x="470" y="271" font-size="11" fill="#646b78" text-anchor="middle" font-weight="normal" >clearly says yes</text>
<text x="44" y="141" font-size="12" fill="#646b78" text-anchor="middle" font-weight="normal" transform="rotate(-90 44 141.0)">chance of feedback</text>
<text x="290" y="294" font-size="12" fill="#646b78" text-anchor="middle" font-weight="normal" >the class&#x27;s vote sum (clipped to −T … +T)</text>
<line x1="110" y1="46" x2="470" y2="236" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round" />
<line x1="110" y1="236" x2="470" y2="46" stroke="#c62828" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/>
<g transform="translate(380.0,188.5)"><g class="anim k1"><circle r="8" fill="#2e7d32" stroke="#f6f4fb" stroke-width="2.5"/></g></g>
<line x1="500" y1="62" x2="526" y2="62" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round" />
<text x="534" y="66" font-size="12.5" fill="#2e7d32" text-anchor="start" font-weight="bold" >The example&#x27;s own class</text>
<text x="500" y="89" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" >The fewer votes it has, the more</text>
<text x="500" y="106" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" >often its clauses are taught.</text>
<text x="500" y="123" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" >Once it wins by T votes, teaching</text>
<text x="500" y="140" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" >stops — those clauses are free to</text>
<text x="500" y="157" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" >learn other examples.</text>
<line x1="500" y1="196" x2="526" y2="196" stroke="#c62828" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/>
<text x="534" y="200" font-size="12.5" fill="#c62828" text-anchor="start" font-weight="bold" >A random wrong class</text>
<text x="500" y="223" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" >The more it (wrongly) votes yes,</text>
<text x="500" y="240" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" >the more often its clauses are</text>
<text x="500" y="257" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" >corrected.</text></svg>
