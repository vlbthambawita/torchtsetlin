<text x="690" y="114" font-size="11.5" fill="#646b78" text-anchor="middle" font-weight="normal" >80</text>
<g transform="translate(418.8,92)"><g class="anim k5"><polygon points="0,-14 -8,-28 8,-28" fill="#5e35b1"/><text x="0" y="-34" font-size="13" fill="#5e35b1" text-anchor="middle" font-weight="bold" opacity="0" class="anim k1">age = 25</text><text x="0" y="-34" font-size="13" fill="#5e35b1" text-anchor="middle" font-weight="bold" class="anim k2">age = 45</text><text x="0" y="-34" font-size="13" fill="#5e35b1" text-anchor="middle" font-weight="bold" opacity="0" class="anim k3">age = 65</text><text x="0" y="-34" font-size="13" fill="#5e35b1" text-anchor="middle" font-weight="bold" opacity="0" class="anim k4">age = 35</text></g></g>
<text x="68" y="180" font-size="13" fill="#1f2328" text-anchor="end" font-weight="bold" >bits</text>
