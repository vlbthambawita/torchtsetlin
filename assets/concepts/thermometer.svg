<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Thermometer encoding</title><desc>A number such as age is turned into bits age at least 20, 30, 40, 50 and 60. The bits fill up from the left as the value grows, and a range such as 30 to 49 needs only two literals.</desc><style>@keyframes k1{0.000%{opacity:1} 27.490%{opacity:1} 27.500%{opacity:0} 99.490%{opacity:0} 99.500%{opacity:1} 100.000%{opacity:1}}
.k1{animation:k1 12s linear infinite}
@keyframes k2{0.000%{opacity:0} 27.490%{opacity:0} 27.500%{opacity:1} 52.490%{opacity:1} 52.500%{opacity:0} 100.000%{opacity:0}}
.k2{animation:k2 12s linear infinite}
@keyframes k3{0.000%{opacity:0} 52.490%{opacity:0} 52.500%{opacity:1} 77.490%{opacity:1} 77.500%{opacity:0} 100.000%{opacity:0}}
.k3{animation:k3 12s linear infinite}
@keyframes k4{0.000%{opacity:0} 77.490%{opacity:0} 77.500%{opacity:1} 99.490%{opacity:1} 99.500%{opacity:0} 100.000%{opacity:0}}
.k4{animation:k4 12s linear infinite}
@keyframes k5{0.000%{transform:translate(-155.0px,0.0px)} 25.000%{transform:translate(-155.0px,0.0px)} 27.500%{transform:translate(0.0px,0.0px)} 50.000%{transform:translate(0.0px,0.0px)} 52.500%{transform:translate(155.0px,0.0px)} 75.000%{transform:translate(155.0px,0.0px)} 77.500%{transform:translate(-77.5px,0.0px)} 97.000%{transform:translate(-77.5px,0.0px)} 99.500%{transform:translate(-155.0px,0.0px)} 100.000%{transform:translate(-155.0px,0.0px)}}
.k5{animation:k5 12s ease-in-out infinite}
@keyframes k6{0.000%{opacity:1} 100.000%{opacity:1}}
.k6{animation:k6 12s linear infinite}
@keyframes k7{0.000%{opacity:0} 27.490%{opacity:0} 27.500%{opacity:1} 99.490%{opacity:1} 99.500%{opacity:0} 100.000%{opacity:0}}
.k7{animation:k7 12s linear infinite}
@keyframes k8{0.000%{opacity:0} 27.490%{opacity:0} 27.500%{opacity:1} 77.490%{opacity:1} 77.500%{opacity:0} 100.000%{opacity:0}}
.k8{animation:k8 12s linear infinite}
@keyframes k9{0.000%{opacity:0} 52.490%{opacity:0} 52.500%{opacity:1} 77.490%{opacity:1} 77.500%{opacity:0} 100.000%{opacity:0}}
.k9{animation:k9 12s linear infinite}
@keyframes k10{0.000%{opacity:0} 52.490%{opacity:0} 52.500%{opacity:1} 77.490%{opacity:1} 77.500%{opacity:0} 100.000%{opacity:0}}
.k10{animation:k10 12s linear infinite}
@keyframes k11{0.000%{opacity:0} 27.490%{opacity:0} 27.500%{opacity:1} 52.490%{opacity:1} 52.500%{opacity:0} 77.490%{opacity:0} 77.500%{opacity:1} 99.490%{opacity:1} 99.500%{opacity:0} 100.000%{opacity:0}}
.k11{animation:k11 12s linear infinite}
@keyframes k12{0.000%{opacity:1} 27.490%{opacity:1} 27.500%{opacity:0} 52.490%{opacity:0} 52.500%{opacity:1} 77.490%{opacity:1} 77.500%{opacity:0} 99.490%{opacity:0} 99.500%{opacity:1} 100.000%{opacity:1}}
.k12{animation:k12 12s linear infinite}
@media (prefers-reduced-motion: reduce){.anim{animation:none!important}}</style><text x="50" y="97" font-size="13" fill="#1f2328" text-anchor="end" font-weight="bold" >age</text>
