<text x="380" y="191" font-size="16" fill="#646b78" text-anchor="middle" font-weight="bold" >0</text>
<g  class="anim k8"><rect x="324" y="150" width="112" height="50" rx="8" fill="#d8e6fa" stroke="#1d63c4" stroke-width="2" /><text x="380" y="170" font-size="12" fill="#1d63c4" text-anchor="middle" font-weight="normal" >age ≥ 40</text><text x="380" y="191" font-size="16" fill="#1d63c4" text-anchor="middle" font-weight="bold" >1</text></g>
