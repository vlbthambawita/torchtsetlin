<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Message passing in a graph Tsetlin machine</title><desc>A five-node sequence B A A A E. Layer 0: the clause component C0 = A matches nodes X1, X2 and X3. Each match is sent to the neighbours as a message bound to the edge type. Layer 1: the component C1 = left1:0 AND right1:0 needs a match on both sides, which only X2 has, so the deep clause holds at X2 and the clause is True for the graph.</desc><text x="18" y="100" font-size="13.5" fill="#e4e6eb" text-anchor="start" font-weight="bold" >Layer 0</text>
<text x="18" y="119" font-size="12.5" fill="#ffa060" text-anchor="start" font-weight="normal" >C⁰ = A</text>
<text x="18" y="290" font-size="13.5" fill="#e4e6eb" text-anchor="start" font-weight="bold" >Layer 1</text>
<text x="18" y="309" font-size="12.5" fill="#ffa060" text-anchor="start" font-weight="normal" >C¹ = left1:0</text>
<text x="18" y="326" font-size="12.5" fill="#ffa060" text-anchor="start" font-weight="normal" >  AND right1:0</text>
