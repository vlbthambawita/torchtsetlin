<text x="390" y="357" font-size="13" fill="#ffa060" text-anchor="middle" font-weight="bold" >The deep clause C⁰ ∧ C¹ holds only at X2, so C is True for the graph (OR over nodes).</text>
<text x="390" y="379" font-size="11.5" fill="#a0a7b4" text-anchor="middle" font-weight="normal" >right1:0 = clause 0 matched at the neighbour on the left (message came along a right-going edge)</text></svg>
