<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>One literal as a Markov chain</title><desc>Four memory positions of one literal. A true literal in an example of the rule&#x27;s class always moves up; a false literal there moves down with probability 1/s; a false literal in an example of another class moves up only while it is forgotten.</desc><text x="380" y="26" font-size="14.5" fill="#1f2328" text-anchor="middle" font-weight="bold" >One literal, four memory positions</text>
<text x="380" y="46" font-size="11.5" fill="#646b78" text-anchor="middle" font-weight="normal" >(L, Y): the literal is true in an example of the rule&#x27;s class. (L, not Y) never moves it.</text>
<rect x="30" y="66" width="320" height="180" rx="14" fill="#eceef2" stroke="none" stroke-width="1.5" />
<rect x="410" y="66" width="320" height="180" rx="14" fill="#fde0ce" stroke="none" stroke-width="1.5" />
<text x="190" y="88" font-size="13" fill="#646b78" text-anchor="middle" font-weight="bold" >Forgotten (excluded)</text>
<text x="570" y="88" font-size="13" fill="#ae4609" text-anchor="middle" font-weight="bold" >Memorized (included)</text>
<circle cx="110" cy="156" r="25" fill="#fffaf4" stroke="#646b78" stroke-width="2.5"/>
<text x="110" y="162" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold" >1</text>
<circle cx="270" cy="156" r="25" fill="#fffaf4" stroke="#646b78" stroke-width="2.5"/>
<text x="270" y="162" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold" >2</text>
<circle cx="490" cy="156" r="25" fill="#fffaf4" stroke="#ae4609" stroke-width="2.5"/>
<text x="490" y="162" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold" >3</text>
<circle cx="650" cy="156" r="25" fill="#fffaf4" stroke="#ae4609" stroke-width="2.5"/>
<text x="650" y="162" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold" >4</text>
<path d="M137,146 Q190.0,106 243,146" fill="none" stroke="#2e7d32" stroke-width="2.2"/>
<polygon points="243,146 234,140 239,134" fill="#2e7d32"/>
<path d="M243,166 Q190.0,206 137,166" fill="none" stroke="#c62828" stroke-width="2.2" stroke-dasharray="6 4"/>
<polygon points="137,166 146,172 141,178" fill="#c62828"/>
<text x="190" y="116" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="bold" >(L, Y) or (not L, not Y)</text>
<text x="190" y="206" font-size="11" fill="#c62828" text-anchor="middle" font-weight="bold" >(not L, Y) · 1/s</text>
<path d="M297,146 Q380.0,106 463,146" fill="none" stroke="#2e7d32" stroke-width="2.2"/>
<polygon points="463,146 454,140 459,134" fill="#2e7d32"/>
<path d="M463,166 Q380.0,206 297,166" fill="none" stroke="#c62828" stroke-width="2.2" stroke-dasharray="6 4"/>
<polygon points="297,166 306,172 301,178" fill="#c62828"/>
<text x="380" y="116" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="bold" >(L, Y) or (not L, not Y)</text>
<text x="380" y="206" font-size="11" fill="#c62828" text-anchor="middle" font-weight="bold" >(not L, Y) · 1/s</text>
<path d="M517,146 Q570.0,106 623,146" fill="none" stroke="#2e7d32" stroke-width="2.2"/>
<polygon points="623,146 614,140 619,134" fill="#2e7d32"/>
<path d="M623,166 Q570.0,206 517,166" fill="none" stroke="#c62828" stroke-width="2.2" stroke-dasharray="6 4"/>
<polygon points="517,166 526,172 521,178" fill="#c62828"/>
<text x="570" y="116" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="bold" >(L, Y) only</text>
<text x="570" y="206" font-size="11" fill="#c62828" text-anchor="middle" font-weight="bold" >(not L, Y) · 1/s</text>
<text x="380" y="272" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" >Green: one step towards memorized. Red: one step towards forgotten, with probability 1/s.</text>
<text x="380" y="290" font-size="12" fill="#646b78" text-anchor="middle" font-weight="normal" >Reject feedback (not L, not Y) only acts on the forgotten side: it adds a literal but never deepens one.</text></svg>
