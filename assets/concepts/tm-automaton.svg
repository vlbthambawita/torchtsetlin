<line x1="380" y1="50" x2="380" y2="132" stroke="#5e35b1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="220" y="44" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold" >FORGET  ·  literal left out of the clause</text>
<text x="540" y="44" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold" >REMEMBER  ·  literal included</text>
<text x="100" y="140" font-size="11.5" fill="#646b78" text-anchor="middle" font-weight="normal" >firmly forgotten</text>
<text x="380" y="150" font-size="11.5" fill="#646b78" text-anchor="middle" font-weight="normal" >on the fence</text>
<text x="660" y="140" font-size="11.5" fill="#646b78" text-anchor="middle" font-weight="normal" >firmly remembered</text>
<g transform="translate(500.0,91.0)"><g class="anim k1"><circle r="25" fill="#5e35b1"/><text x="0" y="4.5" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" >Sunny</text></g></g>
<g class="anim k2"><g ><line x1="330" y1="196" x2="116" y2="196" stroke="#c62828" stroke-width="2.5" stroke-linecap="round" /><polygon points="110,196 119.0,191.7 119.0,200.3" fill="#c62828"/></g><text x="220" y="187" font-size="12.5" fill="#c62828" text-anchor="middle" font-weight="normal" >penalty: one step towards forgetting</text></g>
<g class="anim k3"><g ><line x1="430" y1="196" x2="644" y2="196" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" /><polygon points="650,196 641.0,200.3 641.0,191.7" fill="#2e7d32"/></g><text x="540" y="187" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-weight="normal" >reward: one step towards remembering</text></g>
<text x="200" y="248" font-size="13" fill="#1f2328" text-anchor="end" font-weight="bold" >The clause right now:</text>
<g class="anim k4"><rect x="212" y="228" width="86" height="30" rx="15" fill="#e6def6" stroke="#5e35b1" stroke-width="1.5" /><text x="255" y="247.5" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="normal" >Sunny</text></g>
<g opacity="0" class="anim k5"><rect x="212" y="228" width="86" height="30" rx="15" fill="none" stroke="#cfd3db" stroke-width="1.5"  stroke-dasharray="4 3"/><text x="255" y="247.5" font-size="12.5" fill="#646b78" text-anchor="middle" font-weight="normal" >Sunny</text></g>
<text x="318" y="248" font-size="11.5" fill="#646b78" text-anchor="middle" font-weight="bold" >AND</text>
<rect x="340" y="228" width="100" height="30" rx="15" fill="#e6def6" stroke="#5e35b1" stroke-width="1.5" /><text x="390" y="247.5" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="normal" >Weekend</text>
<text x="456" y="248" font-size="11.5" fill="#646b78" text-anchor="start" font-weight="normal" >← Sunny is in only while the token is on the right</text></svg>
