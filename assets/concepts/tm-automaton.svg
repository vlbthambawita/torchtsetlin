<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>A Tsetlin automaton</title><desc>A token on a track of eight positions decides whether the literal Sunny is in the clause. Rewards push it right towards remembering, penalties push it left towards forgetting; it only changes the clause when it crosses the middle.</desc><style>@keyframes k1{0.000%{transform:translate(-160.0px,0.0px)} 7.000%{transform:translate(-160.0px,0.0px)} 10.500%{transform:translate(-80.0px,0.0px)} 19.000%{transform:translate(-80.0px,0.0px)} 22.500%{transform:translate(0.0px,0.0px)} 31.000%{transform:translate(0.0px,0.0px)} 34.500%{transform:translate(80.0px,0.0px)} 46.000%{transform:translate(80.0px,0.0px)} 49.500%{transform:translate(0.0px,0.0px)} 58.000%{transform:translate(0.0px,0.0px)} 61.500%{transform:translate(-80.0px,0.0px)} 70.000%{transform:translate(-80.0px,0.0px)} 73.500%{transform:translate(-160.0px,0.0px)} 82.000%{transform:translate(-160.0px,0.0px)} 85.500%{transform:translate(-240.0px,0.0px)} 93.000%{transform:translate(-240.0px,0.0px)} 96.500%{transform:translate(-160.0px,0.0px)} 100.000%{transform:translate(-160.0px,0.0px)}}
.k1{animation:k1 11s ease-in-out infinite}
@keyframes k2{0.000%{opacity:.3} 45.990%{opacity:.3} 46.000%{opacity:1} 52.990%{opacity:1} 53.000%{opacity:.3} 57.990%{opacity:.3} 58.000%{opacity:1} 64.990%{opacity:1} 65.000%{opacity:.3} 69.990%{opacity:.3} 70.000%{opacity:1} 76.990%{opacity:1} 77.000%{opacity:.3} 81.990%{opacity:.3} 82.000%{opacity:1} 88.990%{opacity:1} 89.000%{opacity:.3} 100.000%{opacity:.3}}
.k2{animation:k2 11s linear infinite}
@keyframes k3{0.000%{opacity:.3} 6.990%{opacity:.3} 7.000%{opacity:1} 13.990%{opacity:1} 14.000%{opacity:.3} 18.990%{opacity:.3} 19.000%{opacity:1} 25.990%{opacity:1} 26.000%{opacity:.3} 30.990%{opacity:.3} 31.000%{opacity:1} 37.990%{opacity:1} 38.000%{opacity:.3} 92.990%{opacity:.3} 93.000%{opacity:1} 100.000%{opacity:1}}
.k3{animation:k3 11s linear infinite}
@keyframes k4{0.000%{opacity:0} 8.740%{opacity:0} 8.750%{opacity:1} 20.740%{opacity:1} 20.750%{opacity:1} 32.740%{opacity:1} 32.750%{opacity:1} 47.740%{opacity:1} 47.750%{opacity:1} 59.740%{opacity:1} 59.750%{opacity:1} 71.740%{opacity:1} 71.750%{opacity:0} 83.740%{opacity:0} 83.750%{opacity:0} 94.740%{opacity:0} 94.750%{opacity:0} 100.000%{opacity:0}}
.k4{animation:k4 11s linear infinite}
@keyframes k5{0.000%{opacity:1} 8.740%{opacity:1} 8.750%{opacity:0} 20.740%{opacity:0} 20.750%{opacity:0} 32.740%{opacity:0} 32.750%{opacity:0} 47.740%{opacity:0} 47.750%{opacity:0} 59.740%{opacity:0} 59.750%{opacity:0} 71.740%{opacity:0} 71.750%{opacity:1} 83.740%{opacity:1} 83.750%{opacity:1} 94.740%{opacity:1} 94.750%{opacity:1} 100.000%{opacity:1}}
.k5{animation:k5 11s linear infinite}
