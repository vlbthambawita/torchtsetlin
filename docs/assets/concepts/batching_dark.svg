<text x="24" y="136" font-size="14" fill="#e4e6eb" text-anchor="start" font-weight="bold" >A mini-batch</text>
<text x="24" y="152" font-size="11.5" fill="#a0a7b4" text-anchor="start" font-weight="normal" >the default  ·  feedback_mode=&quot;batch&quot;</text>
