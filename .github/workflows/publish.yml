name: Publish to PyPI

on:
  push:
    tags: ["v*"]          # e.g. git tag v0.1.0 && git push origin v0.1.0
  workflow_dispatch:      # manual run -> publishes to TestPyPI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch) and run the test-suite
        run: |
          python -m pip install --upgrade pip build twine
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-import the built wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          cd /tmp && /tmp/wheel-check/bin/python -c "import torchtsetlin, torchtsetlin.data, torchtsetlin.models, torchtsetlin.train, torchtsetlin.interpret, torchtsetlin.viz; print(torchtsetlin.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torchtsetlin
    permissions:
      id-token: write     # required for Trusted Publishing (no API token needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/torchtsetlin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
